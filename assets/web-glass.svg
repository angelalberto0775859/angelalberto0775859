<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="409" viewBox="0 0 1200 409" role="img" aria-labelledby="t d"><title id="t">Desarrollo web</title><desc id="d">React, TypeScript y HTML para sitios, interfaces y plataformas digitales. Figma para diseño de interfaces y experiencia de usuario. VS Code, Codex y Claude como herramientas de trabajo y asistencia al desarrollo.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111f32"/><stop offset="1" stop-color="#0b121b"/></linearGradient><linearGradient id="glass" x2=".4" y2="1"><stop stop-color="#fff" stop-opacity=".085"/><stop offset="1" stop-color="#fff" stop-opacity=".025"/></linearGradient><radialGradient id="glow"><stop stop-color="#389dff" stop-opacity=".15"/><stop offset="1" stop-color="#389dff" stop-opacity="0"/></radialGradient><pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94b9d8" opacity=".18"/></pattern><clipPath id="clip"><rect width="1200" height="409" rx="30"/></clipPath></defs><style>.pattern{animation:drift 22s cubic-bezier(.76,0,.24,1) infinite}@keyframes drift{0%,100%{transform:translate(0,0);opacity:.45}50%{transform:translate(12px,-12px);opacity:.8}}@media(prefers-reduced-motion:reduce){.pattern{animation:none}}</style><g clip-path="url(#clip)"><rect width="1200" height="409" fill="url(#bg)"/><ellipse cx="1130" cy="80" rx="400" ry="400" fill="url(#glow)"/><rect class="pattern" x="810" y="-20" width="410" height="449" fill="url(#dots)"/><rect x="16" y="16" width="1168" height="377" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="54" y="48" width="68" height="68" rx="19" fill="#389dff" fill-opacity=".16" stroke="#389dff" stroke-opacity=".4"/><text x="88" y="94" text-anchor="middle" font-size="27" fill="#389dff">‹/›</text><text x="144" y="79" fill="#f4f7fb" font-size="30" font-weight="600">Desarrollo web</text><text x="144" y="110" fill="#97abc0" font-size="19">Interfaces y plataformas</text><path d="M54 143H1146" stroke="#fff" stroke-opacity=".09"/><text x="54" y="190" font-size="24" fill="#d1dce8">React, TypeScript y HTML para sitios, interfaces y plataformas digitales.</text><text x="54" y="258" font-size="24" fill="#d1dce8">Figma para diseño de interfaces y experiencia de usuario.</text><text x="54" y="326" font-size="24" fill="#d1dce8">VS Code, Codex y Claude como herramientas de trabajo y asistencia al desarrollo.</text></g></g></svg>