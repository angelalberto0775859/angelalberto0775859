<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="t d">
<title id="t">Angel Alberto Arista Villanueva</title>
<desc id="d">Digital animation and game engineer working across web development, visual identity and audiovisual production. Mexico City.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#17171b"/><stop offset=".55" stop-color="#101014"/><stop offset="1" stop-color="#08080a"/>
</linearGradient>
<radialGradient id="glow" cx=".18" cy="0" r=".9">
<stop offset="0" stop-color="#7fb2ff" stop-opacity=".16"/><stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="1" cy="1" r=".7">
<stop offset="0" stop-color="#8affc8" stop-opacity=".10"/><stop offset="1" stop-color="#8affc8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="name" x1="0" y1="0" x2=".7" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity=".76"/>
</linearGradient>
<linearGradient id="hair" x1="0" x2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="370" rx="30"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="1200" height="372" fill="url(#panel)"/>
  <rect width="1200" height="372" fill="url(#glow)"/>
  <rect width="1200" height="372" fill="url(#glow2)"/>
  <rect y="1" width="1200" height="1" fill="#ffffff" opacity=".12"/>
</g>
<rect x=".5" y=".5" width="1199" height="371" rx="30.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>

<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text x="84" y="96" fill="#ffffff" fill-opacity=".42" font-size="15" font-weight="500" letter-spacing="3.4">DIGITAL ANIMATION &amp; GAME ENGINEERING</text>

  <text x="80" y="190" fill="url(#name)" font-size="62" font-weight="600" letter-spacing="-1.8">Angel Alberto Arista Villanueva</text>

  <text x="84" y="240" fill="#ffffff" fill-opacity=".58" font-size="25" font-weight="400" letter-spacing="-.3">Web development · Visual identity · Audiovisual production</text>

  <g transform="translate(84 288)">
    <rect x="0" y="0" width="1032" height="1" fill="url(#hair)"/>
    <text x="0" y="42" fill="#ffffff" fill-opacity=".42" font-size="16" font-weight="400" letter-spacing=".2">Mexico City, Mexico<tspan fill-opacity=".45">   ·   </tspan>Graphic simulation specialty<tspan fill-opacity=".45">   ·   </tspan>Open to freelance &amp; full-time work</text>
  </g>
</g>
</svg>
