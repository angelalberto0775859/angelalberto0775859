<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Angel Alberto Arista Villanueva</title><desc id="desc">Ingeniería, creatividad y estrategia. Luces azules y verdes detrás de un panel translúcido.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#060910"/></linearGradient>
<radialGradient id="blue"><stop stop-color="#0080ff" stop-opacity=".85"/><stop offset="1" stop-color="#0080ff" stop-opacity="0"/></radialGradient>
<radialGradient id="green"><stop stop-color="#39ff14" stop-opacity=".5"/><stop offset="1" stop-color="#39ff14" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x2=".35" y2="1"><stop stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".42"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".23"/></linearGradient>
<filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".28"/></filter>
<clipPath id="bounds"><rect width="1200" height="510" rx="30"/></clipPath>
</defs>
<style>.blue{animation:bluefloat 16s cubic-bezier(.76,0,.24,1) infinite}.green{animation:greenfloat 19s cubic-bezier(.76,0,.24,1) infinite}@keyframes bluefloat{0%,100%{transform:translate(0,0)}50%{transform:translate(48px,-24px)}}@keyframes greenfloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-38px,28px)}}@media(prefers-reduced-motion:reduce){.blue,.green{animation:none}}</style>
<g clip-path="url(#bounds)"><rect width="1200" height="510" fill="url(#bg)"/>
<ellipse class="blue" cx="220" cy="160" rx="470" ry="380" fill="url(#blue)"/><ellipse class="green" cx="1020" cy="390" rx="380" ry="340" fill="url(#green)"/>
<rect x="38" y="36" width="1124" height="438" rx="30" fill="url(#glass)" stroke="url(#edge)" filter="url(#shadow)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="86" y="97" font-size="16" letter-spacing="4" fill="#C8D7E9">ANGEL ARISTA</text>
<rect x="917" y="72" width="196" height="36" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><circle cx="937" cy="90" r="4" fill="#39ff14"/><text x="953" y="96" font-size="14" fill="#E2F3E8">CDMX, México</text>
<text x="82" y="181" font-size="57" font-weight="600" letter-spacing="-2" fill="#FFFFFF">Angel Alberto</text><text x="82" y="246" font-size="57" font-weight="600" letter-spacing="-2" fill="#FFFFFF">Arista Villanueva.</text>
<text x="85" y="296" font-size="24" fill="#DCE6F5">Ingeniería. Creatividad. Estrategia.</text><path d="M86 332H1114" stroke="#ffffff" stroke-opacity=".14"/>
<text x="86" y="374" font-size="17" fill="#EAF0F8">Desarrollo web · Identidad visual · Animación · IA</text><text x="86" y="408" font-size="16" fill="#ADBED1">Ideas que se convierten en experiencias digitales.</text>
</g></g></svg>